services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-text2sql}
      POSTGRES_USER: ${DB_USER:-text2sql}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-text2sql}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-text2sql} -d ${DB_NAME:-text2sql}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-text2sql}
      DB_USER: ${DB_USER:-text2sql}
      DB_PASSWORD: ${DB_PASSWORD:-text2sql}
      DATABASE_URL: ${DATABASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: